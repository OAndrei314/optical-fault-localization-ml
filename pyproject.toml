[project]
name = "optical-fault-localization-ml"
version = "0.1.0"
description = "Synthetic OTDR-trace fault classification and localization on coherent optical links."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8", "joblib>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
